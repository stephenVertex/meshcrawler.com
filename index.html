<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshCrawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        .tagline {
            margin-top: 0.5rem;
            font-size: 1.5rem;
            color: #64748b;
        }
        .cta {
            margin-top: 2rem;
        }
        .cta a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .cta a:hover {
            background: #2563eb;
        }
        footer {
            position: absolute;
            bottom: 2rem;
            color: #475569;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MeshCrawler</h1>
        <p class="tagline">Exploring the interconnected web</p>
        <p>Welcome to MeshCrawler.com — your hub for web exploration and discovery.</p>
        <div class="cta">
            <a href="mailto:hello@meshcrawler.com">Get in Touch</a>
        </div>
    </div>
    <footer>
        &copy; 2026 MeshCrawler. All rights reserved.
    </footer>
</body>
</html>
